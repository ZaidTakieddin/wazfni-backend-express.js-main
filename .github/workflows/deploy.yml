name: Deploy Bun Backend

on:
  push:
    branches:
      - main

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest

    steps:
      - name: SSH into server and deploy
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ secrets.SERVER_HOST }}
          username: ${{ secrets.SERVER_USER }}
          key: ${{ secrets.SERVER_SSH_KEY }}
          port: 22
          script: |
            # Ensure that the necessary binaries are available
            export PATH=$HOME/.bun/bin:/usr/local/bin:$PATH

            # Navigate to the project directory
            cd /root/wazfni-backend-express.js-main

            # Remove conflicting migration files
            rm -rf prisma/migrations/*

            # Pull the latest changes from the repository
            git reset --hard HEAD
            git pull origin main

            # Install dependencies
            bun install

            # Generate Prisma client
            bunx prisma generate

            # Resolve any migration conflicts (if necessary)
            bunx prisma migrate resolve --applied "20250503121507_init"

            # Run migrations
            bunx prisma migrate deploy

            # Build the project
            bun run build

            # Ensure Node.js is installed if it's missing
            curl -sL https://deb.nodesource.com/setup_18.x | bash -
            apt-get install -y nodejs

            # Restart or start PM2 process
            pm2 restart wazfni-backend-express.js || pm2 start "bun run start" --name wazfni-backend-express.js
