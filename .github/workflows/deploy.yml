name: Deploy Bun Backend

on:
  push:
    branches:
      - main # or "master" or your main branch

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest

    env:
      DATABASE_URL: ${{ secrets.DATABASE_URL }}

    steps:
      - name: Checkout code
        uses: actions/checkout@v3

      - name: Install Bun
        uses: curl -fsSL https://bun.sh/install | bash

      - name: Install dependencies
        run: bun install

      - name: Generate Prisma client
        run: bunx prisma generate

      - name: Run Prisma migrations (optional for dev/staging)
        run: bunx prisma migrate deploy

      - name: Build project (if applicable)
        run: bun run build

      # Deploy via SSH
      - name: Deploy to Contabo Server
        uses: appleboy/scp-action@v0.1.7
        with:
          host: ${{ secrets.SERVER_HOST }}
          username: ${{ secrets.SERVER_USER }}
          key: ${{ secrets.SERVER_SSH_KEY }}
          port: 22
          script: |
            cd /root/wazfni-backend-express.js-main
            pm2 restart wazfni-api || pm2 start bun run start --name wazfni-api